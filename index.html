<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle Recebíveis</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }

        body { background: #f4f6f9; }

        /* ===== TELA DE LOGIN ===== */
        #tela-login {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1e3a5f, #2d6a9f);
        }

        .login-card {
            background: #fff;
            padding: 40px 35px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 380px;
        }

        .login-card h1 {
            text-align: center;
            color: #1e3a5f;
            margin-bottom: 8px;
            font-size: 24px;
        }

        .login-card p {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .login-card label {
            display: block;
            margin-bottom: 6px;
            color: #333;
            font-size: 14px;
            font-weight: bold;
        }

        .login-card input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        .login-card button {
            width: 100%;
            padding: 13px;
            background: #2d6a9f;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .login-card button:hover { background: #1e3a5f; }

        #erro-login {
            display: none;
            background: #fdecea;
            color: #c0392b;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
            text-align: center;
        }

        /* ===== SISTEMA (APÓS LOGIN) ===== */
        #sistema {
            display: none;
            min-height: 100vh;
            padding: 20px;
        }

        #sistema.visible { display: block; }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e3a5f;
            color: #fff;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .topbar h2 { font-size: 18px; }

        .topbar button {
            background: #e74c3c;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .topbar button:hover { background: #c0392b; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- ===== TELA DE LOGIN ===== -->
    <div id="tela-login">
        <div class="login-card">
            <h1>Controle Recebíveis</h1>
            <p>Entre para acessar o sistema</p>

            <div id="erro-login"></div>

            <form id="form-login">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="seu@email.com" required>

                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Sua senha" required>

                <button type="submit">ENTRAR</button>
            </form>
        </div>
    </div>

    <!-- ===== SISTEMA (APÓS LOGIN) ===== -->
    <div id="sistema">
        <div class="topbar">
            <h2>📊 Painel Financeiro</h2>
            <button id="btn-sair">Sair</button>
        </div>

        <!-- 👇 COLE AQUI O CONTEÚDO DO SEU SISTEMA FINANCEIRO -->
        <div id="conteudo-sistema">
            <!-- SEU CÓDIGO AQUI -->
        </div>
    </div>

    <!-- ===== SCRIPTS ===== -->
    <!-- 1º: carrega o Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // ===== CONFIGURAÇÃO DO SUPABASE =====
        // ⚠️ Confira que URL e chave abaixo são IGUAIS às que funcionam no console
        const SUPABASE_URL = 'https://iomskeqqgfgetaymheup.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_LwcQSXB9eLlkhoCRWGDTjg_W2Em1u8F';

        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // ===== ELEMENTOS =====
        const telaLogin = document.getElementById('tela-login');
        const sistema = document.getElementById('sistema');
        const erroLogin = document.getElementById('erro-login');
        const formLogin = document.getElementById('form-login');

        function mostrarSistema() {
            telaLogin.classList.add('hidden');
            sistema.classList.add('visible');
            carregarNotas(); // carrega os dados do sistema
        }

        function mostrarLogin() {
            sistema.classList.remove('visible');
            telaLogin.classList.remove('hidden');
        }

        function mostrarErro(msg) {
            erroLogin.textContent = msg;
            erroLogin.style.display = 'block';
        }

        // ===== LOGIN =====
        formLogin.addEventListener('submit', async (e) => {
            e.preventDefault();
            erroLogin.style.display = 'none';

            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;

            const { data, error } = await db.auth.signInWithPassword({
                email: email,
                password: senha
            });

            if (error) {
                mostrarErro(error.message);
                console.error('❌ Erro no login:', error.message);
                return;
            }

            console.log('✅ Login OK!');
            mostrarSistema();
        });

        // ===== LOGOUT =====
        document.getElementById('btn-sair').addEventListener('click', async () => {
            await db.auth.signOut();
            // O onAuthStateChange abaixo cuida de voltar para a tela de login
        });

        // ===== RESTAURA SESSÃO AO CARREGAR A PÁGINA =====
        // 🔑 Isso resolve o problema: ao dar F5, verifica se já está logado
        window.addEventListener('load', async () => {
            const { data: { session } } = await db.auth.getSession();
            if (session) {
                mostrarSistema();
            }
        });

        // ===== MANTÉM O APP SINCRONIZADO COM LOGIN/LOGOUT =====
        db.auth.onAuthStateChange((event, session) => {
            if (event === 'SIGNED_IN' || session) {
                mostrarSistema();
            } else if (event === 'SIGNED_OUT') {
                mostrarLogin();
            }
        });

        // ===== FUNÇÃO DE CARREGAMENTO DE DADOS =====
        // 👇 COLE AQUI A SUA FUNÇÃO carregarNotas() (a que busca os dados no banco)
        function carregarNotas() {
            // SEU CÓDIGO AQUI
            console.log('📋 carregarNotas() chamado');
        }
    </script>
</body>
</html>
